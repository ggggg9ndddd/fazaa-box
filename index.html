<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فزعة | صندوق الطوارئ الأكاديمي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">

    <header>
        <div class="logo-box">
            <span class="lightning-icon">⚡</span>
            <span class="logo-text">صندوق فزعة</span>
        </div>
        <p>فزعتك وقت الزنقة!</p>
        <div class="box-status" id="boxStatus"><span class="dot"></span><span class="txt">جارٍ التحقق من الصندوق…</span></div>
    </header>

    <div class="content">

        <!-- تحميل -->
        <div id="view-loading" class="view active"><div class="loader"></div></div>

        <!-- إعدادات Firebase غير مكتملة -->
        <div id="view-setup" class="view">
            <div class="banner banner-danger">
                <strong>إعدادات Firebase غير مكتملة.</strong>
                افتح الملف <code>firebase-config.js</code> وضع بيانات مشروعك، ثم أعد تحميل الصفحة.
            </div>
        </div>

        <!-- تسجيل الدخول / إنشاء حساب -->
        <div id="view-auth" class="view">
            <button type="button" class="btn btn-google btn-block" id="googleBtn">
                <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
                الدخول بحساب Google
            </button>
            <div class="or-divider"><span>أو بالبريد الإلكتروني</span></div>
            <div class="tabs">
                <button class="tab active" data-tab="login" type="button">تسجيل الدخول</button>
                <button class="tab" data-tab="register" type="button">حساب جديد</button>
            </div>

            <form id="loginForm" class="tab-panel active" data-panel="login">
                <div class="form-group">
                    <label for="loginEmail">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" class="form-control" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">كلمة المرور</label>
                    <input type="password" id="loginPassword" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-block mt-20">دخول</button>
                <button type="button" class="btn-link mt-12" id="forgotBtn">نسيت كلمة المرور؟</button>
            </form>

            <form id="registerForm" class="tab-panel" data-panel="register">
                <div class="form-group">
                    <label for="regName">اسم الطالب ثلاثي</label>
                    <input type="text" id="regName" class="form-control" placeholder="الاسم الأول واسم الأب واسم العائلة" minlength="3" maxlength="80" required>
                </div>
                <div class="form-group">
                    <label for="regUni">الرقم الجامعي</label>
                    <input type="text" id="regUni" class="form-control" placeholder="مثال: 123456" inputmode="numeric" pattern="[0-9]{4,12}" required>
                </div>
                <div class="form-group">
                    <label for="regPhone">رقم الهاتف (واتساب)</label>
                    <input type="tel" id="regPhone" class="form-control" placeholder="مثال: 91234567" inputmode="numeric" pattern="[0-9]{8}" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">البريد الإلكتروني</label>
                    <input type="email" id="regEmail" class="form-control" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">كلمة المرور (6 أحرف على الأقل)</label>
                    <input type="password" id="regPassword" class="form-control" minlength="6" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-accent btn-block mt-20">إنشاء الحساب</button>
            </form>
        </div>

        <!-- إكمال البيانات (إذا كان الحساب موجوداً بلا بيانات) -->
        <div id="view-profile" class="view">
            <h2 class="section-title">أكمل بياناتك</h2>
            <p class="hint text-start">مرة واحدة فقط — نحتاج اسمك الثلاثي ورقمك الجامعي قبل الحجز.</p>
            <form id="profileForm">
                <div class="form-group">
                    <label for="pName">اسم الطالب ثلاثي</label>
                    <input type="text" id="pName" class="form-control" placeholder="الاسم الأول واسم الأب واسم العائلة" minlength="3" maxlength="80" required>
                </div>
                <div class="form-group">
                    <label for="pUni">الرقم الجامعي</label>
                    <input type="text" id="pUni" class="form-control" inputmode="numeric" pattern="[0-9]{4,12}" required>
                </div>
                <div class="form-group">
                    <label for="pPhone">رقم الهاتف (واتساب)</label>
                    <input type="tel" id="pPhone" class="form-control" inputmode="numeric" pattern="[0-9]{8}" required>
                </div>
                <button type="submit" class="btn btn-block mt-20">حفظ</button>
                <button type="button" class="btn-link mt-12 js-logout">تسجيل الخروج</button>
            </form>
        </div>

        <!-- الواجهة الرئيسية -->
        <div id="view-main" class="view">
            <div class="userbar">
                <div><span class="muted">أهلاً،</span> <strong id="userName"></strong></div>
                <button class="btn-back js-logout" type="button">تسجيل الخروج</button>
            </div>

            <div id="alerts"></div>
            <div id="rentalPanel"></div>

            <div id="toolsPanel">
                <div id="step-tools" class="step-panel active">
                    <h2 class="section-title">الأدوات المتاحة للحجز</h2>
                    <div class="tools-grid" id="toolsGrid"></div>
                </div>
                <div id="step-plan" class="step-panel">
                    <div class="panel-header">
                        <h2 class="section-title">مدة الاستئجار</h2>
                        <button class="btn-back" type="button" id="planBack">→ عودة</button>
                    </div>
                    <div id="planBox"></div>
                </div>
            </div>

            <div id="historyPanel"></div>
        </div>

    </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
